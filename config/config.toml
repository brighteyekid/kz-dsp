# ~/.config/iem-dspd/config.toml
# KZ Castor IEM — Harman-target parametric EQ correction
# Generated by iem-dspd v0.1.0

sample_rate = 48000
quantum     = 256         # frames per PipeWire quantum (power of 2)
output_gain_db = -3.0     # headroom guard; compensates for PEQ boosts

# ---------------------------------------------------------------------------
# 10-Band Parametric EQ
# type: "peaking" | "low_shelf" | "high_shelf" | "low_pass" | "high_pass" | "notch" | "all_pass"
# ---------------------------------------------------------------------------

[[peq]]
freq     = 55.0
gain_db  = 3.5
q        = 0.71
type     = "low_shelf"
enabled  = true

[[peq]]
freq     = 200.0
gain_db  = -2.5
q        = 1.00
type     = "peaking"
enabled  = true

[[peq]]
freq     = 400.0
gain_db  = -1.8
q        = 1.20
type     = "peaking"
enabled  = true

[[peq]]
freq     = 900.0
gain_db  = 1.0
q        = 1.50
type     = "peaking"
enabled  = true

[[peq]]
freq     = 1800.0
gain_db  = -2.0
q        = 2.00
type     = "peaking"
enabled  = true

[[peq]]
freq     = 3200.0
gain_db  = 3.0
q        = 1.20
type     = "peaking"
enabled  = true

[[peq]]
freq     = 5000.0
gain_db  = -4.5
q        = 2.50
type     = "peaking"
enabled  = true

[[peq]]
freq     = 8000.0
gain_db  = 2.5
q        = 2.00
type     = "peaking"
enabled  = true

[[peq]]
freq     = 10000.0
gain_db  = -3.0
q        = 3.00
type     = "peaking"
enabled  = true

[[peq]]
freq     = 16000.0
gain_db  = 2.0
q        = 0.71
type     = "high_shelf"
enabled  = true

# ---------------------------------------------------------------------------
# BS2B Crossfeed
# Simulates loudspeaker crosstalk for natural soundstage on IEMs.
# ---------------------------------------------------------------------------
[crossfeed]
enabled        = true
cutoff_hz      = 700.0    # HRTF pinna shadow frequency
feed_level     = 0.45     # cross-channel gain [0.0–1.0]
delay_samples  = 14.4     # IATD ≈ 0.3 ms @ 48 kHz
