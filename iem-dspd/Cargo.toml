[package]
name = "iem-dspd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iem-dspd"
path = "src/main.rs"

[dependencies]
iem-common = { path = "../iem-common" }

# PipeWire Rust bindings (system libpipewire-0.3 via pkg-config)
pipewire = "0.10"

# Real-time thread priority (SCHED_FIFO)
thread-priority = "1"

# Lock-free atomic config swap — single atomic load in RT path
arc-swap = "1"

# Async runtime for IPC server only — NOT in the RT audio thread
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialisation / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"

# Config path resolution (~/.config/…)
dirs = "5"
