[workspace]
members = [
    "iem-common",
    "iem-dspd",
    "iem-ui",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-rt]
inherits = "release"
# Extra: enable CPU-native tuning via RUSTFLAGS="-C target-cpu=native"
